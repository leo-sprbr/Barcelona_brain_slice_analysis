# ============================================================
# Brain Slice Analysis Pipeline — Configuration File
#
# ALL analysis parameters, paths, and settings live here.
# You should never need to edit the source files to change
# filter cutoffs, thresholds, or paths — just edit this file.
#
# Each section corresponds to one module in src/.
# ============================================================


# ------------------------------------------------------------
# PATHS
# All paths are relative to the project root (where this file
# lives), unless you use an absolute path.
# ------------------------------------------------------------
paths:
  raw_data_dir:     "Z:/datasets/BCN_Slices/20260414"         # Where .smr files are stored
  processed_dir:    "data/processed"   # Where .h5 files are written
  condition_dir:    "data/condition"
  results_dir:      "results"          # Where CSVs and figures are saved
  figures_dir:      "results/figures"  # Subfolder for plots


# ------------------------------------------------------------
# EXPERIMENTAL CONDITIONS
# List the condition labels used in your experiment, in order.
# These labels must match the 'condition' field you assign when
# loading data (see data_io.py and Experiment class).
#
# The pipeline always treats the FIRST condition as "baseline"
# for delta calculations.
# ------------------------------------------------------------
conditions:
  - "baseline"
  - "stimulation"
  - "post_stimulation"

# Label used as the reference for delta (Δ) calculations.
# Must be one of the conditions above.
baseline_condition: "baseline"


# ------------------------------------------------------------
# PREPROCESSING
# Parameters for extracting the three signals used in Up/Down
# detection from the raw LFP.
# ------------------------------------------------------------
preprocessing:

  # Which channel index to use (0-based). Set to null to average
  # all channels. You can also pass a list of indices to average,
  # e.g. [0, 1, 2]. 
  channel: [1]            # null → average all 32 channels

  high_channels: []
  low_channels: []

  # Slow Oscillation (SO) signal
  # Bandpass filter range (Hz). The resulting signal captures the
  # slow negative deflection associated with Down states.
  so_band: [0.1, 1.5]

  # Gamma envelope
  # Bandpass range (Hz) for the gamma band. The envelope is
  # computed as the variance of the filtered signal in a sliding
  # window of size gamma_window_ms.
  gamma_band: [30, 100]
  gamma_window_ms: 50        # Sliding window length in milliseconds

  # Multi-Unit Activity (MUA)
  # Bandpass range (Hz) for the high-frequency / MUA band.
  # Power is computed in short windows (mua_window_ms), then
  # log-transformed to reduce large fluctuations.
  mua_band: [200, 1500]
  mua_window_ms: 5           # Short window for MUA power (ms)

  # Filter order for all bandpass filters (Butterworth)
  filter_order: 4

  # Downsampling target rate (Hz) AFTER feature extraction.
  # The three feature signals (SO, gamma env, logMUA) are
  # downsampled to this rate before PCA.
  # Set to null to keep original sampling rate (slower but exact).
  downsample_to_hz: 1000


# ------------------------------------------------------------
# UP/DOWN STATE DETECTION
# Parameters for the PCA-based detection described in
# Tort-Colet et al. (2021).
# ------------------------------------------------------------
up_down:

  # Thresholding strategy for separating Up and Down states
  # from the bimodal PC1 distribution.
  #
  # Options:
  #   "kde"    — fit a KDE to PC1 and find the valley between
  #              the two modes automatically (recommended)
  #   "manual" — use the fixed threshold value below
  threshold_method: "kde"

  # Only used when threshold_method is "manual"
  manual_threshold: 0.0

  # Minimum duration (seconds) for a state to be counted.
  # Events shorter than this are merged with the adjacent state.
  min_up_duration_s:   0.05   # 50 ms
  min_down_duration_s: 0.05   # 50 ms

  # KDE bandwidth factor (multiplied by Scott's rule).
  # Increase if the KDE is too noisy; decrease if it is too smooth.
  kde_bandwidth_factor: 1.0


# ------------------------------------------------------------
# FIRING RATES
# Parameters for computing firing rates from logMUA.
# ------------------------------------------------------------
firing_rates:

  # Gaussian smoothing kernel standard deviation (ms).
  # Applied to logMUA before computing transition-aligned traces.
  smoothing_sigma_ms: 50

  # Time window (seconds) around each state transition for
  # aligned firing rate traces.
  # A window of 1.0 means ±1.0 s around each Up or Down onset.
  alignment_window_s: 1.0


# ------------------------------------------------------------
# METRICS & OUTLIER EXCLUSION
# ------------------------------------------------------------
metrics:

  # Confidence interval level for excluding slices with too few
  # Up states (soft exclusion). Events outside this CI are
  # discarded from duration analyses.
  ci_soft: 0.95       # 95% CI — as per the paper

  # Harder exclusion threshold (for very low Up-state counts).
  ci_hard: 0.999      # 99.9% CI — as per the paper


# ------------------------------------------------------------
# STATISTICS
# ------------------------------------------------------------
statistics:

  # Significance level (alpha)
  alpha: 0.05

  # Multiple comparison correction method.
  # Options: "bonferroni", "fdr_bh" (Benjamini-Hochberg), "none"
  correction: "bonferroni"

  # Significance labels used in plots
  significance_labels:
    - [0.05,   "*"]
    - [0.01,   "**"]
    - [0.001,  "***"]
    - [0.0001, "****"]


# ------------------------------------------------------------
# ARTIFACT REJECTION
# Applied within each trial window by define_trials.py.
# All parameters can be tuned here without touching any code.
# ------------------------------------------------------------
artifact_rejection:

  # Amplitude threshold in units of local standard deviations.
  # A sample is flagged as an artifact if:
  #     |sample| > z_threshold × local_std
  #
  # Start with 8.0 for brain slice LFP with large transient spikes.
  # Lower values (e.g. 5.0) catch subtler artifacts but risk false positives.
  z_threshold: 8.0

  # Duration of the local std estimation window (ms).
  # Should be long enough to contain several oscillation cycles but short
  # enough to track slow changes in background noise level.
  window_ms: 1000.0

  # Padding added around each detected artifact (ms).
  # Captures ringing and filter edge effects surrounding a spike.
  pad_ms: 50.0

  # Gaps between artifact regions shorter than this (ms) are filled in.
  # Prevents leaving tiny clean islands between two bursts.
  min_gap_ms: 100.0


# ------------------------------------------------------------
# TRIAL DEFINITION
# Used by scripts/define_trials.py.
# ------------------------------------------------------------
trial_definition:

  # If True, the interactive matplotlib figure will be launched
  # automatically when running define_trials.py without --trials.
  # Set to False to require explicit --interactive flag.
  default_interactive: true

  # Minimum allowed trial duration (seconds).
  # Trials shorter than this will produce a warning.
  min_trial_duration_s: 30.0


# ------------------------------------------------------------
# FIGURE SETTINGS
# ------------------------------------------------------------
figures:
  dpi: 150
  format: "pdf"        # "pdf", "png", or "svg"
  style: "seaborn-v0_8-whitegrid"
  colormap: "tab10"    # matplotlib colormap for condition colours
